linked_mortality_2019:
  status: blocked
  blocked_reasons:
    - "The official public-use NHIS LMF has no person-month follow-up field; PERMTH_INT and PERMTH_EXM appear only in the NHANES layout."
  index_url: "https://www.cdc.gov/nchs/linked-data/mortality-files/index.html"
  description_url: "https://www.cdc.gov/nchs/data/datalinkage/public-use-linked-mortality-file-description.pdf"
  dictionary_url: "https://www.cdc.gov/nchs/data/datalinkage/public-use-linked-mortality-files-data-dictionary.pdf"
  read_program_url: "https://ftp.cdc.gov/pub/Health_statistics/NCHS/datalinkage/linked_mortality/R_ReadInProgramAllSurveys.R"
  data_url_template: "https://ftp.cdc.gov/pub/Health_Statistics/NCHS/datalinkage/linked_mortality/NHIS_{year}_MORT_2019_PUBLIC.dat"
  fields:
    person_id: {source: PUBLICID}
    mortality_eligibility:
      source: ELIGSTAT
      codes:
        eligible: ["1"]
        under_18_not_released: ["2"]
        ineligible: ["3"]
      missing_codes: []
    mortality_status:
      source: MORTSTAT
      codes:
        alive: ["0"]
        deceased: ["1"]
      missing_codes: [""]
    followup_days: {source: null}
  verified_fixed_width_layout:
    PUBLICID: [1, 14]
    ELIGSTAT: [15, 15]
    MORTSTAT: [16, 16]
    UCOD_LEADING: [17, 19]
    DIABETES: [20, 20]
    HYPERTEN: [21, 21]
    DODQTR: [22, 22]
    DODYEAR: [23, 26]
    WGT_NEW: [27, 34]
    SA_WGT_NEW: [35, 42]
