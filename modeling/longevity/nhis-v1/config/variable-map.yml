schema_version: 2

# Field names and category codes below come from the INPUT and PROC FORMAT
# blocks in the official annual NCHS SAS programs referenced by each year.
definitions:
  sex: &sex
    source: SEX
    codes:
      male: ["1"]
      female: ["2"]
    missing_codes: []
  education_1997_2003: &education_1997_2003
    source: EDUC
    codes:
      college: ["18", "19", "20", "21"]
      some: ["15", "16", "17"]
      high_school: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"]
    missing_codes: ["96", "97", "98", "99"]
  education_2004_2018: &education_2004_2018
    source: EDUC1
    codes:
      college: ["18", "19", "20", "21"]
      some: ["15", "16", "17"]
      high_school: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"]
    missing_codes: ["96", "97", "98", "99"]
  health: &health
    source: PHSTAT
    codes:
      excellent: ["1", "2"]
      good: ["3"]
      fair: ["4", "5"]
    missing_codes: ["7", "8", "9"]
  smoking: &smoking
    source: SMKSTAT2
    codes:
      never: ["4"]
      former: ["3"]
      current: ["1", "2"]
    missing_codes: ["5", "9"]
  person_1997_2003: &person_1997_2003
    person_id: {source: [SRVY_YR, HHX, FMX, PX]}
    interview_quarter: {source: INTV_QRT}
    age_at_interview: {source: AGE_P}
    sex: *sex
    education: *education_1997_2003
    self_rated_health: *health
    stratum: {source: STRATUM}
    psu: {source: PSU}
  person_2004: &person_2004
    person_id: {source: [SRVY_YR, HHX, FMX, FPX]}
    interview_quarter: {source: null}
    age_at_interview: {source: AGE_P}
    sex: *sex
    education: *education_2004_2018
    self_rated_health: *health
    stratum: {source: STRATUM}
    psu: {source: PSU}
  person_2005: &person_2005
    person_id: {source: [SRVY_YR, HHX, FMX, FPX]}
    interview_quarter: {source: INTV_QRT}
    age_at_interview: {source: AGE_P}
    sex: *sex
    education: *education_2004_2018
    self_rated_health: *health
    stratum: {source: STRATUM}
    psu: {source: PSU}
  person_2006_2015: &person_2006_2015
    person_id: {source: [SRVY_YR, HHX, FMX, FPX]}
    interview_quarter: {source: INTV_QRT}
    age_at_interview: {source: AGE_P}
    sex: *sex
    education: *education_2004_2018
    self_rated_health: *health
    stratum: {source: STRAT_P}
    psu: {source: PSU_P}
  person_2016_2018: &person_2016_2018
    person_id: {source: [SRVY_YR, HHX, FMX, FPX]}
    interview_quarter: {source: INTV_QRT}
    age_at_interview: {source: AGE_P}
    sex: *sex
    education: *education_2004_2018
    self_rated_health: *health
    stratum: {source: PSTRAT}
    psu: {source: PPSU}
  sample_adult_1997_2003: &sample_adult_1997_2003
    person_id: {source: [SRVY_YR, HHX, FMX, PX]}
    smoking: *smoking
    sample_weight: {source: WTFA_SA}
  sample_adult_2004_2018: &sample_adult_2004_2018
    person_id: {source: [SRVY_YR, HHX, FMX, FPX]}
    smoking: *smoking
    sample_weight: {source: WTFA_SA}

