schema_version: 1

# These code lists are transcribed from the PROC FORMAT blocks in the official
# annual NCHS Sample Adult SAS input programs. An unavailable source is null;
# it is never replaced by a guessed name from another NHIS component file.
definitions:
  sex: &sex
    source: SEX
    codes:
      male: ["1"]
      female: ["2"]
    missing_codes: []
  smoking: &smoking
    source: SMKSTAT2
    codes:
      never: ["4"]
      former: ["3"]
      current: ["1", "2"]
    missing_codes: ["5", "9"]
  education: &education
    source: EDUC
    codes:
      college: ["18", "19", "20", "21"]
      some: ["15", "16", "17"]
      high_school: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"]
    missing_codes: ["96", "97", "98", "99"]
  unavailable_health: &unavailable_health
    source: null
    codes: {}
    missing_codes: []

